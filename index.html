<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trading VIP Channel</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Outer Card Box */
        .card-container {
            background-color: #111827;
            border: 3px solid #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Logo Styling */
        .logo-box {
            background-color: #ffffff;
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .circle-logo {
            background: linear-gradient(135deg, #ef4444 0%, #10b981 100%);
            width: 135px;
            height: 135px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-weight: 800;
            line-height: 1.1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .logo-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-main {
            font-size: 26px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .logo-tiny {
            font-size: 9px;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Headings */
        .main-heading {
            color: #ffffff;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .star {
            color: #facc15;
        }

        .sub-heading {
            color: #10b981;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 18px;
        }

        /* VIP Badge */
        .badge-vip {
            background: linear-gradient(90deg, #ef4444, #10b981);
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Telegram Button */
        .telegram-btn {
            background-color: #10b981;
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 17px;
            padding: 14px 20px;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            border: none;
            width: 100%;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .telegram-btn:hover {
            transform: scale(1.03);
            background-color: #059669;
        }

        .telegram-icon {
            font-size: 18px;
            transform: rotate(-20deg);
        }

        /* Features List */
        .features-list {
            list-style: none;
            text-align: left;
            max-width: 350px;
            margin: 0 auto 22px auto;
        }

        .features-list li {
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            letter-spacing: 0.3px;
            color: #e5e7eb;
        }

        .features-list span {
            margin-right: 10px;
            font-size: 15px;
        }

        /* Join Now Footer */
        .join-now {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ef4444, #facc15, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .join-now:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Top Trading Logo -->
        <div class="logo-box">
            <div class="circle-logo">
                <span class="logo-title">Color</span>
                <span class="logo-main">TRADING</span>
                <span class="logo-tiny">100% Sure Signals</span>
            </div>
        </div>

        <!-- Main Heading -->
        <h1 class="main-heading">
            <span class="star">&#9733;</span> VIP COLOR TRADING <span class="star">&#9733;</span>
        </h1>

        <p class="sub-heading">&#128200; INDIA'S NO.1 PREDICTION CHANNEL &#128640;</p>

        <!-- VIP Badge -->
        <div class="badge-vip">
            <span>&#128308;</span>
            <span>DAILY 3-4 SURE SHOT WIN</span>
            <span>&#128994;</span>
        </div>

        <!-- Telegram Button with JS Click Event -->
        <button class="telegram-btn" id="telegramBtn">
            <span class="telegram-icon">&#10148;</span>
            <span>Join Free Telegram Channel</span>
            <span class="telegram-icon">&#10148;</span>
        </button>

        <!-- Features List -->
        <ul class="features-list">
            <li><span class="check-icon">&#9989;</span> 100% ACCURATE COLOR PREDICTION</li>
            <li><span class="briefcase-icon">&#128184;</span> DAILY RECOVERY PROFIT SESSIONS</li>
            <li><span class="money-icon">&#128176;</span> LOW CAPITAL SAFE PLAY TRICKS</li>
            <li><span class="clock-icon">&#9200;</span> 24/7 SUPPORT & GUIDANCE</li>
        </ul>

        <!-- Bottom Call to Action -->
        <div class="join-now" id="joinNowText">
            START EARNING NOW !!
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const telegramBtn = document.getElementById('telegramBtn');
        const joinNowText = document.getElementById('joinNowText');

        telegramBtn.addEventListener('click', function() {
            // Yahan aap apna Telegram channel link daal sakte hain
            alert("Redirecting to Color Trading VIP Telegram Channel...");
            // window.location.href = "https://t.me/your_telegram_channel";
        });

        joinNowText.addEventListener('click', function() {
            alert("Click on 'Join Free Telegram Channel' to start trading!");
        });

        console.log("Color Trading Landing Page Loaded Successfully!");
    </script>
</body>
</html>
